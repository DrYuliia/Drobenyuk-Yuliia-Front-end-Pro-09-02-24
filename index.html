<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук поста за ID</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Пошук поста за ID</h1>

    <form id="post-form">
        <label for="post-id">Введіть ID поста (від 1 до 100):</label>
        <input type="number" id="post-id" min="1" max="100" required>
        <button type="submit">Знайти пост</button>
    </form>

    <div id="error-container"></div>
    <div id="post-container"></div>
    <div id="comments-container"></div>

    <script src="script.js"></script>
</body>


</html>
